[project]
name = "cos-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psutil>=5.9",
  "pywinrm>=0.4",
  "httpx>=0.26",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "pyotp>=2.9",
  "jinja2>=3.1",
  "weasyprint>=61",
  "statsmodels>=0.14",
  "pmdarima>=2.0",
  "prophet>=1.1",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "pandas>=2.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "alembic>=1.13",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "ruff>=0.3",
  "mypy>=1.8",
  "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["libs"]
include = ["cognitive_core*", "perception*", "reasoning*", "learning*", "action*", "procedural_memory*", "access*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PL", "TRY"]

[tool.ruff.per-file-ignores]
"tests/security/adversarial/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]