# Dependabot configuration for COS-Monitor
# Enables dependency update PRs for every real manifest in the repository.

version: 2
updates:
  # --- Python (one entry per real pyproject.toml: root + 16 nested projects) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/apps/gateway/api-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/apps/services/anomaly-service"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 10
    target-branch: "main"
    labels: ["security", "dependencies"]

