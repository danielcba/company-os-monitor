# Secret scanning exclusions live in .github/secret_scanning.yml (paths-ignore).
# That file is the GitHub-supported mechanism for excluding paths from secret
# scanning alerts; it is NOT a dependabot key ("secret-scanning" is not part of
# the dependabot schema: version, updates, registries).
