# Secret scanning configuration for COS-Monitor
# Defines paths NOT scanned for secrets (GitHub `paths-ignore`).
# Every entry must exist in this repository: `decisions/**` and `rfc/**` were
# removed on 2026-09-26 (they only exist in the Framework repo — Monitor has no
# `decisions/` or `rfc/` directory, and no policy references them).
#
# 2026-10-02 (G2 remediation): broad prose exclusions (`docs/**`, `adr/**`,
# `journal/**`) and `.gitignore` / `.opencode/**` were REMOVED — they created
# a scanning blind spot with no false-positive justification (0 secret alerts
# in history). Only entries with a concrete reason remain: `.env.example`
# contains credential-shaped placeholders by design; `node_modules/**` and
# `.venv*/**` are generated, never-tracked content.

paths-ignore:
  - '.env.example'
  - 'node_modules/**'
  - '.venv*/**'
