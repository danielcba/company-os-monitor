name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["20"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cos_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov bandit safety
          pip install -e .
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
      
      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            redis-cli -h localhost -p 6379 ping && break
            sleep 1
          done
      
      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: MyPy typecheck (libs)
        run: mypy --config-file mypy.ini libs/
      
      - name: MyPy typecheck (gateway)
        working-directory: apps/gateway/api-gateway
        run: mypy --config-file ../../../mypy.ini src/
      
      - name: MyPy typecheck (services)
        run: |
          failed=0
          for svc in apps/services/*/; do
            if [ -d "$svc/src" ]; then
              echo "=== Typechecking $svc ==="
              (cd "$svc" && mypy --config-file ../../../mypy.ini src/) || failed=1
            fi
          done
          exit $failed

      - name: Root tests
        run: pytest tests/ --cov=libs --cov-report=xml -v

      - name: Service tests (each from its own directory)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cos_monitor
          REDIS_URL: redis://localhost:6379/0
        run: |
          for svc in apps/services/*/; do
            if [ -d "$svc/tests" ] && ls "$svc/tests"/test_*.py 1>/dev/null 2>&1; then
              echo "=== Testing $svc ==="
              (cd "$svc" && PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short) || exit 1
            fi
          done

      - name: Gateway tests
        working-directory: apps/gateway/api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cos_monitor
          REDIS_URL: redis://localhost:6379/0
        run: PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short

      - name: Frontend setup
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend tests
        working-directory: apps/web
        run: npm run test

      - name: Security scan
        run: bandit -r apps/ libs/ -ll

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml build
