name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          POSTGRES_DB: cosmonitor
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U cosmonitor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: cosmonitor
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping --pass cosmonitor" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # NOTE: no `safety` here - it was installed but never executed, and its
          # `check` command has been deprecated since 01 Jun 2024 while `scan`
          # requires an authenticated Safety account. A tool that never runs is
          # dead configuration; bandit below is the executed security gate.
          pip install "ruff==0.16.3" "mypy==2.3.0" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "bandit==1.9.4" "psycopg2-binary==2.9.12" "redis==8.1.0"
          pip install -e .

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: cosmonitor
        run: |
          for i in {1..30}; do
            python -c "import psycopg2; psycopg2.connect(host='localhost', port=5433, user='cosmonitor', password='cosmonitor', database='cosmonitor').close()" && echo "PostgreSQL ready" && exit 0
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
          echo "PostgreSQL not ready after 30s"
          exit 1

      - name: Wait for Redis
        env:
          REDIS_PASSWORD: cosmonitor
        run: |
          for i in {1..30}; do
            python -c "import redis; r=redis.Redis(host='localhost', port=6379, password='cosmonitor', socket_connect_timeout=2); r.ping()" && echo "Redis ready" && exit 0
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "Redis not ready after 30s"
          exit 1

      - name: Apply database base schema
        env:
          PGPASSWORD: cosmonitor
        run: |
          echo "Applying base schema"
          psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f infrastructure/docker/init-sql/01-schema.sql

      - name: Apply database migrations
        env:
          PGPASSWORD: cosmonitor
        run: |
          for f in infrastructure/db-migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f "$f" || exit 1
          done

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: MyPy typecheck (libs)
        run: mypy --config-file mypy.ini libs/

      - name: MyPy typecheck (gateway)
        working-directory: apps/gateway/api-gateway
        run: mypy --config-file ../../../mypy.ini src/

      - name: MyPy typecheck (services)
        run: |
          failed=0
          for svc in apps/services/*/; do
            if [ -d "$svc/src" ]; then
              echo "=== Typechecking $svc ==="
              (cd "$svc" && mypy --config-file ../../../mypy.ini src/) || failed=1
            fi
          done
          exit $failed

      - name: Root tests
        run: pytest tests/ --cov=libs --cov-report=xml -v

      - name: Service tests (each from its own directory)
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0?password=cosmonitor
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          PGDATABASE: cosmonitor
        run: |
          for svc in apps/services/*/; do
            if [ -d "$svc/tests" ] && ls "$svc/tests"/test_*.py 1>/dev/null 2>&1; then
              echo "=== Testing $svc ==="
              (cd "$svc" && PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short) || exit 1
            fi
          done

      - name: Gateway tests
        working-directory: apps/gateway/api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0?password=cosmonitor
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          PGDATABASE: cosmonitor
        run: PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short

      - name: Frontend setup
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend tests
        working-directory: apps/web
        run: npm run test

      - name: Frontend dependency audit (SCA)
        # Policy: fail the job on any known vulnerability in the locked tree.
        # Complements Dependabot (alerts + update PRs) with an execution gate.
        working-directory: apps/web
        run: npm audit

      - name: Security scan
        run: bandit -r apps/ libs/ -ll -c bandit.yaml

      - name: Dependency audit (SCA)
        # Policy: fail the job on any known vulnerability in the installed
        # environment. Sole documented exception: PYSEC-2026-1325 (ecdsa
        # 0.19.2, transitive via python-jose) has no fixed release as of
        # 2026-10-02; remove the exception when a fix ships. Complements
        # Dependabot (alerts + update PRs) with an execution gate.
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit --ignore-vuln PYSEC-2026-1325

      - name: Upload coverage
        # Informational only: coverage upload is NOT a release gate.
        # fail_ci_if_error: false is deliberate - a Codecov outage must not turn
        # a green test run red. The required status checks ("lint-and-test (3.12,
        # 24)", "docker-build") are enforced by the steps above, not by this upload.
        # Pinned by full commit SHA to the maintained v7.0.0 line (composite
        # action; no legacy Node action runtime). Compatibility hardening: the
        # previous pin was v3.1.1 (runs.using: node16). The exact origin of the
        # EPROTO/TLS handshake failure observed in run 37252838032 was NOT
        # determined and is not attributed here to any component.
        # continue-on-error: true is propagation isolation at the GitHub Actions
        # level: run 37252838032 proved fail_ci_if_error: false alone did not
        # keep the job green when this step failed, so a future Codecov failure
        # cannot redden the job. It limits blast radius; it does not explain
        # the transport error.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Evaluation Service image
        run: |
          docker build \
            -f apps/services/evaluation-service/Dockerfile \
            -t evaluation-service:ci \
            .

      - name: Build Docker images
        env:
          POSTGRES_PASSWORD: ci-build-only
          REDIS_PASSWORD: ci-build-only
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml build
