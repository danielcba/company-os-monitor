name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          POSTGRES_DB: cosmonitor
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U cosmonitor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.3" "mypy==2.3.0" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "bandit==1.9.4" safety "psycopg2-binary==2.9.12" "redis==8.1.0"
          pip install -e .

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            python -c "import psycopg2; psycopg2.connect(host='localhost', port=5433, user='cosmonitor', password='cosmonitor', database='cosmonitor').close()" && echo "PostgreSQL ready" && exit 0
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
          echo "PostgreSQL not ready after 30s"
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            python -c "import redis; redis.Redis(host='localhost', port=6379, socket_connect_timeout=2).ping()" && echo "Redis ready" && exit 0
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "Redis not ready after 30s"
          exit 1

      - name: Apply database base schema
        env:
          PGPASSWORD: cosmonitor
        run: |
          echo "Applying base schema"
          psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f infrastructure/docker/init-sql/01-schema.sql

      - name: Apply database migrations
        env:
          PGPASSWORD: cosmonitor
        run: |
          for f in infrastructure/db-migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f "$f" || exit 1
          done

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: MyPy typecheck (libs)
        run: mypy --config-file mypy.ini libs/

      - name: MyPy typecheck (gateway)
        working-directory: apps/gateway/api-gateway
        run: mypy --config-file ../../../mypy.ini src/

      - name: MyPy typecheck (services)
        run: |
          failed=0
          for svc in apps/services/*/; do
            if [ -d "$svc/src" ]; then
              echo "=== Typechecking $svc ==="
              (cd "$svc" && mypy --config-file ../../../mypy.ini src/) || failed=1
            fi
          done
          exit $failed

      - name: Root tests
        run: pytest tests/ --cov=libs --cov-report=xml -v

      - name: Service tests (each from its own directory)
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0
        run: |
          for svc in apps/services/*/; do
            if [ -d "$svc/tests" ] && ls "$svc/tests"/test_*.py 1>/dev/null 2>&1; then
              echo "=== Testing $svc ==="
              (cd "$svc" && PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short) || exit 1
            fi
          done

      - name: Gateway tests
        working-directory: apps/gateway/api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0
        run: PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short

      - name: Frontend setup
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend tests
        working-directory: apps/web
        run: npm run test

      - name: Security scan
        run: bandit -r apps/ libs/ -ll -c bandit.yaml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml build