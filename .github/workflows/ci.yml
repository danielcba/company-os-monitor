name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          POSTGRES_DB: cosmonitor
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U cosmonitor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: cosmonitor
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping --pass cosmonitor" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.3" "mypy==2.3.0" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "bandit==1.9.4" safety "psycopg2-binary==2.9.12" "redis==8.1.0"
          pip install -e .

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: cosmonitor
        run: |
          for i in {1..30}; do
            python -c "import psycopg2; psycopg2.connect(host='localhost', port=5433, user='cosmonitor', password='cosmonitor', database='cosmonitor').close()" && echo "PostgreSQL ready" && exit 0
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
          echo "PostgreSQL not ready after 30s"
          exit 1

      - name: Wait for Redis
        env:
          REDIS_PASSWORD: cosmonitor
        run: |
          for i in {1..30}; do
            python -c "import redis; r=redis.Redis(host='localhost', port=6379, password='cosmonitor', socket_connect_timeout=2); r.ping()" && echo "Redis ready" && exit 0
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "Redis not ready after 30s"
          exit 1

      - name: Apply database base schema
        env:
          PGPASSWORD: cosmonitor
        run: |
          echo "Applying base schema"
          psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f infrastructure/docker/init-sql/01-schema.sql

      - name: Apply database migrations
        env:
          PGPASSWORD: cosmonitor
        run: |
          for f in infrastructure/db-migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U cosmonitor -d cosmonitor -f "$f" || exit 1
          done

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: MyPy typecheck (libs)
        run: mypy --config-file mypy.ini libs/

      - name: MyPy typecheck (gateway)
        working-directory: apps/gateway/api-gateway
        run: mypy --config-file ../../../mypy.ini src/

      - name: MyPy typecheck (services)
        run: |
          failed=0
          for svc in apps/services/*/; do
            if [ -d "$svc/src" ]; then
              echo "=== Typechecking $svc ==="
              (cd "$svc" && mypy --config-file ../../../mypy.ini src/) || failed=1
            fi
          done
          exit $failed

      - name: Root tests
        run: pytest tests/ --cov=libs --cov-report=xml -v

      - name: Service tests (each from its own directory)
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0?password=cosmonitor
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          PGDATABASE: cosmonitor
        run: |
          for svc in apps/services/*/; do
            if [ -d "$svc/tests" ] && ls "$svc/tests"/test_*.py 1>/dev/null 2>&1; then
              echo "=== Testing $svc ==="
              (cd "$svc" && PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short) || exit 1
            fi
          done

      - name: Gateway tests
        working-directory: apps/gateway/api-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://cosmonitor:cosmonitor@localhost:5433/cosmonitor
          REDIS_URL: redis://localhost:6379/0?password=cosmonitor
          POSTGRES_USER: cosmonitor
          POSTGRES_PASSWORD: cosmonitor
          PGDATABASE: cosmonitor
        run: PYTHONPATH="${{ github.workspace }}" python -m pytest tests/ -v --tb=short

      - name: Frontend setup
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend tests
        working-directory: apps/web
        run: npm run test

      - name: Security scan
        run: bandit -r apps/ libs/ -ll -c bandit.yaml

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Evaluation Service image
        run: |
          docker build \
            -f apps/services/evaluation-service/Dockerfile \
            -t evaluation-service:ci \
            .

      - name: Build Docker images
        env:
          POSTGRES_PASSWORD: ci-build-only
          REDIS_PASSWORD: ci-build-only
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml build
