[project]
name = "vmware-agent"
version = "0.1.0"
description = "VMware Observation Capturer (vSphere API) - Perception Layer"
requires-python = ">=3.11"
dependencies = [
  "pyVmomi>=6.7",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "python-dotenv>=1.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "ruff>=0.3",
  "mypy>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["BLE001"]
"src/health.py" = ["BLE001"]
