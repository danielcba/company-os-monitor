# Bandit configuration for COS-Monitor
#
# Accepted (false-positive) findings in this codebase:
#
#   B104 hardcoded_bind_all_interfaces
#     The 14 host-native production services (start.sh SERVICE_SPECS +
#     linux-agent, ports 8090-8103) bind 127.0.0.1 only: they run as plain
#     host processes - not inside containers - and every verified consumer
#     (gateway, browser, start.sh probes) is host-local (D1 architectural
#     decision, journal/2026/2026-09-29-d1-host-bind-resolution.md).
#     The skip stays because two agent implementations
#     (apps/agents/windows-agent, apps/agents/vmware-agent) still declare
#     0.0.0.0: neither is launched by start.sh, so neither opens a listening
#     socket on this host today; they are outside D1's enumerated scope and
#     belong to the future remote-agent architectural decision.
#
#   B108 hardcoded_tmp_directory
#     Only appears in test fixtures that write sample report files under /tmp.
#     No production code path uses a hardcoded temp directory.
#
# B608 (hardcoded_sql_expressions) is accepted for the two occurrences in
# libs/action/decision.py and apps/gateway/api-gateway/src/decisions.py. Both
# build their SET clause only from a fixed whitelist of parameterized column
# assignments ("actual_outcomes", "executed_at", "status") using named binds;
# no column name or value is ever interpolated from untrusted input, so there
# is no SQL-injection vector. (A per-line "# nosec" cannot be placed on the
# triple-quoted f-string that triggers the rule, hence the centralized skip.)
skips:
  - B104
  - B108
  - B608
